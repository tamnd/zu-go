name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting is the one check that needs neither the engine nor a C
  # compiler, so it answers in seconds rather than after a Rust build.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
      - run: gofmt -l . | tee /tmp/unformatted
      - name: Every file is formatted
        run: test ! -s /tmp/unformatted

  # The analyzers are their own module, they import nothing from the
  # client, and they read source rather than linking against anything,
  # so they need no library and no Rust either.
  zulint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
      - run: go vet ./...
        working-directory: zulint
      - run: go test -count=1 ./...
        working-directory: zulint

  # What can be read off the source rather than run: that every
  # published name says what it is, and that the published signatures
  # are the shapes Go writes. Both link nothing, so they belong beside
  # the other two that answer in seconds rather than in the jobs that
  # build a library first. With cgo off the packages that need it drop
  # out of the pattern on their own, so a gate added tomorrow is run
  # here without this line changing.
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
      - run: CGO_ENABLED=0 go test -count=1 -v ./internal/...

  # What everybody who runs `go get` gets: the library that ships with
  # this module, no Rust, no pkg-config, nothing installed. It is first
  # because it is the mode that has to work, and it finishes in about a
  # minute because there is nothing to build but Go.
  vendored:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26.6", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      # A platform whose archive the Libraries workflow has not
      # produced yet is not a failure of this client, and a red job
      # here would say it was. It says which it is instead.
      - name: Is there a library for this platform
        id: lib
        run: |
          set -eu
          dir="lib/$(go env GOOS)-$(go env GOARCH)"
          if [ -f "$dir/libzu.a" ]; then
            echo "there=yes" >> "$GITHUB_OUTPUT"
            ls -l "$dir/libzu.a"
            echo "built from zu $(cat "$dir/REVISION")"
          else
            echo "there=no" >> "$GITHUB_OUTPUT"
            echo "no archive in $dir yet, run the Libraries workflow"
          fi

      - if: steps.lib.outputs.there == 'yes'
        run: go vet ./... ./zuarrow/... ./corpus/...

      # The client held to its own analyzers, which is the only honest
      # way to ship them. The one place it provokes a mistake on
      # purpose says so with a zulint:ignore comment.
      - if: steps.lib.outputs.there == 'yes'
        name: zulint
        run: |
          set -eu
          (cd zulint && go build -o "$RUNNER_TEMP/zulint" ./cmd/zulint)
          "$RUNNER_TEMP/zulint" ./... ./zuarrow/... ./corpus/...

      - if: steps.lib.outputs.there == 'yes'
        run: go test -count=1 ./... ./zuarrow/... ./corpus/...

      # The concurrency rules here are the whole reason the connection
      # holds a lock, and the interrupt is a second goroutine reaching
      # into a connection another one is inside of. Neither is worth
      # anything unchecked.
      - if: steps.lib.outputs.there == 'yes'
        run: go test -race -count=1 ./... ./zuarrow/... ./corpus/...

      # Not for the numbers, which mean nothing on a shared runner, but
      # because a benchmark is code that only this runs.
      - if: steps.lib.outputs.there == 'yes'
        run: go test -run '^$' -bench . -benchtime 10x ./... ./zuarrow/... ./corpus/...

  # The cross client corpus, run against the archive this repository
  # ships. Every client answers the same fourteen hundred cases and a
  # report is diffed line for line against the other four, so this is
  # the job that says this client agrees with them rather than only
  # with itself.
  #
  # The cases are checked out at the revision the archive was built
  # from, which is what lib/<goos>-<goarch>/REVISION holds, and not at
  # the engine's HEAD. A corpus ahead of the library reports the engine
  # catching up to its own cases as this client failing, which is a red
  # job that says nothing about this repository and cannot be fixed
  # here. The engine job below is the one that runs the pair at HEAD,
  # and that is where a case the engine has not caught up to belongs.
  # The header that ships here against the engine revision the archives
  # that ship beside it were built from, which is the pair that has to
  # agree: a header describing a struct that moved is a compile that
  # succeeds and a read that does not. Against that revision and not
  # against the engine's HEAD, because HEAD is a branch this repository
  # does not control and a check it cannot pass on demand is a check
  # that only ever says the calendar moved.
  #
  # Nothing is built, so this is a checkout of one file and a diff, and
  # it is the fastest job here.
  header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: The engine revision these archives were built from
        id: pin
        run: |
          set -eu
          rev=$(cat lib/linux-amd64/REVISION)
          # Five archives and one revision. Five that disagree is a
          # libraries run that finished half way, and the header can
          # only be the header of one of them.
          for f in lib/*/REVISION; do
            test "$(cat "$f")" = "$rev" || { echo "$f is not $rev"; exit 1; }
          done
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: tamnd/zu
          ref: ${{ steps.pin.outputs.rev }}
          path: engine
          sparse-checkout: crates/zu-capi/include/zu.h
          sparse-checkout-cone-mode: false

      - run: diff -u engine/crates/zu-capi/include/zu.h include/zu.h

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: The engine revision this archive was built from
        id: pin
        run: echo "rev=$(cat lib/linux-amd64/REVISION)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: tamnd/zu
          ref: ${{ steps.pin.outputs.rev }}
          path: engine

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      # Verbose, because the run logs every case the engine has not
      # caught up to and a release branch is read for exactly that.
      - run: go test -count=1 -v ./corpus/...
        env:
          ZU_CASES: ${{ github.workspace }}/engine/conformance/cases

  # The same suite with the allocator watched, which is the scorecard's
  # leaks item and the job that answers the question a binding cannot
  # answer from inside itself: what did it fail to give back.
  #
  # A cgo binding holds two kinds of memory and the collector knows
  # about one of them. What ASan adds is the other: it interposes the
  # allocator that both sides use, so a block the engine malloc'd is a
  # block it can account for, and it instruments Go's own reads and
  # writes, so a slice still pointing into a result that was freed is
  # caught here rather than as a segfault in somebody's service. The
  # engine archive is not instrumented, which costs the checks inside
  # the library and costs nothing here: the mistakes this is written
  # against are a handle dropped, a handle closed twice and a buffer
  # read after the thing that owned it went, and all three are visible
  # at the allocator.
  #
  # Valgrind is the other tool and it is not the tool for this. It sees
  # the instructions rather than the source, which is what makes it
  # good over a prebuilt library, but a goroutine stack is an anonymous
  # mapping it cannot tell from a wild pointer, so reflect.Value.call
  # alone reports over a thousand invalid reads and none of them is
  # this client. What is left after turning off the checks it cannot do
  # here is the leak check, and ASan's leak check is already that.
  #
  # It is a backstop and not an oracle. A pointer to engine memory that
  # is still sitting in a Go heap block nothing reads is a pointer the
  # leak checker can still see, so what it reports is what the
  # collector has already got through, which is why the misuse suite
  # counts descriptors from inside the process as well. The two miss
  # different things.
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      # Without this every frame of a report is a hex offset. The
      # sanitizer runtime looks for llvm-symbolizer on PATH under that
      # exact name, and the images carry it under a versioned one, so
      # the path is found and handed over rather than hoped for.
      - name: The symbolizer the report is read with
        run: |
          set -eu
          sym=$(command -v llvm-symbolizer || ls /usr/bin/llvm-symbolizer-* 2>/dev/null | sort -V | tail -1)
          test -n "$sym"
          echo "ASAN_SYMBOLIZER_PATH=$sym" >> "$GITHUB_ENV"

      # The gate first, because a clean report from a job that never
      # linked the sanitizer looks exactly like a clean report from a
      # job that did. internal/leakgate leaks a megabyte when it is
      # asked to, and this step is the one that wants a failure.
      - name: A leak the job is meant to catch, caught
        run: |
          set +e
          go test -asan -count=1 ./internal/leakgate
          test $? -ne 0 || { echo "the leak gate did not fire on a leak"; exit 1; }
        env:
          ZU_LEAK_GATE: "1"

      - run: go test -asan -count=1 ./... ./zuarrow/... ./corpus/...

  # The same suite against the engine at its own HEAD, through
  # pkg-config, which is the mode a bisect wants. This is what makes a
  # red job mean the client is wrong about the engine rather than that
  # the shipped archive is old.
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: tamnd/zu
          path: engine

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # Whether the vendored header still matches is checked in the
      # header job and not here. This is the at-HEAD job, so the engine
      # is allowed to be ahead of what this repository vendors, the same
      # way a corpus case ahead of the engine is unsupported here rather
      # than failed. Diffing hard against a moving branch turns every
      # commit that touches zu.h in the engine into a red pull request
      # here that the pull request cannot fix, which happened, so what
      # is left is the notice that a refresh is waiting.
      - name: Whether the engine's header has moved past the vendored one
        run: |
          if diff -u include/zu.h engine/crates/zu-capi/include/zu.h; then
            echo "the vendored header is the engine's current header"
          else
            echo "::notice::the engine header has moved past the vendored one, so the pin has a refresh waiting"
          fi

      - name: Build libzu
        working-directory: engine
        run: |
          set -eu
          # The CLI as well as the library, because the staging step
          # packages both and stops on the one it cannot find.
          cargo build --release -p zu-capi -p zu-cli
          target="$(rustc -vV | sed -n 's/^host: //p')"
          # What a static link needs beside the archive, asked of rustc
          # rather than written down here: the answer differs per target
          # and changes with the toolchain, and a Libs.private that is a
          # guess is a pkg-config --static line that does not link.
          syslibs="$(cargo rustc -q --color never --release -p zu-capi \
              --crate-type staticlib -- --print native-static-libs 2>&1 |
              sed -n 's/^note: native-static-libs: //p' | tail -1)"
          test -n "$syslibs"
          cargo run -q -p xtask -- package \
              --stage "$GITHUB_WORKSPACE/dist/libzu" \
              --built target/release --target "$target" --syslibs "$syslibs"
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/dist/libzu/lib/pkgconfig" >> "$GITHUB_ENV"
          # Where the loader looks, which is not where pkg-config
          # looks. A shared library staged into a directory of its own
          # is found at link time by the -L pkg-config hands over and
          # not found at run time by anything, so a test binary links
          # and then dies on the first exec. This is the variable a
          # user unpacking the same tarball sets, and on macOS the
          # dylib carries an absolute install name so it never needed
          # one.
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/dist/libzu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # The ABI revision the header declares is checked by the test
      # suite itself rather than by a step here, so that it fails the
      # same way on a laptop.
      - run: go vet -tags zu_system ./... ./zuarrow/... ./corpus/...

      - run: go test -tags zu_system -count=1 ./... ./zuarrow/... ./corpus/...

      - run: go test -tags zu_system -race -count=1 ./... ./zuarrow/... ./corpus/...

      # The corpus and the engine at the same HEAD, which is the pair a
      # bisect wants and the one that says whether a case the engine has
      # just written passes here. A case ahead of the engine is
      # unsupported and is not a failure, so this stays green through
      # the days between a case landing and the engine answering it.
      - run: go test -tags zu_system -count=1 -v ./corpus/...
        env:
          ZU_CASES: ${{ github.workspace }}/engine/conformance/cases

      # The third mode, which is somebody's own archive named in
      # CGO_LDFLAGS. It is the escape hatch, so it is checked that it
      # still opens.
      - name: Your own archive, through CGO_LDFLAGS
        run: |
          set -eu
          export CGO_LDFLAGS="$GITHUB_WORKSPACE/dist/libzu/lib/libzu.a $(
            sed -n 's/^Libs.private: //p' "$GITHUB_WORKSPACE/dist/libzu/lib/pkgconfig/libzu.pc")"
          go test -tags zu_static -count=1 ./... ./zuarrow/... ./corpus/...
